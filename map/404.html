<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Off the map — Bush Map</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#E9E2D0" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="/public/apple-touch-icon.png" />
    <link rel="stylesheet" href="styles/app.css" />
    <style>
      body { margin: 0; min-height: 100svh; display: grid; place-items: center;
             background: var(--cream, #e9e2d0); font-family: var(--ui-font), system-ui, sans-serif; }
      .nf { max-width: 44ch; padding: 32px; text-align: center; color: var(--ink, #2c2a24); }
      .nf h1 { font-family: var(--head-font), Georgia, serif; font-size: 2.4rem; margin: 0 0 12px; }
      .nf p { font-size: 14px; line-height: 1.7; color: var(--ink-soft, #5a5346); margin: 0 0 22px; }
      .nf a { display: inline-flex; align-items: center; min-height: 24px; padding: 11px 20px;
              border-radius: 999px; background: var(--ink, #2c2a24); color: var(--cream-panel, #f4efe2);
              text-decoration: none; font-size: 13px; font-weight: 600; letter-spacing: 0.03em; }
    </style>
  </head>
  <body>
    <main class="nf">
      <h1>Off the map</h1>
      <p>This road doesn't go anywhere — at least not on our map. Head back and pick a pin instead.</p>
      <a href="/">Back to the map</a>
    </main>
  </body>
</html>
