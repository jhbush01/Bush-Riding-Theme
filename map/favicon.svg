<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Bush Riding">
  <!-- The route: one closed loop, deliberately lopsided so it reads as a track
       and not a target, with the trailhead in the map's own "selected" lemon.
       Single weight on purpose — the cream core the map draws inside the rust
       casing is lovely at 180px and pure noise at 16, which is the size that
       decides a favicon. Ground is #e9e2d0 to match the theme-color meta.
       Square-cornered variant for the iOS touch icon lives in scripts/. -->
  <rect width="64" height="64" rx="14" fill="#e9e2d0"/>
  <path d="M33 12c12 1 18.5 9.5 16 20-2.4 10-11 20-21 18.5C18 49 12 40 14 29.5 16 19 22 11 33 12Z"
        fill="none" stroke="#c0774c" stroke-width="10" stroke-linejoin="round"/>
  <circle cx="33" cy="12" r="8" fill="#d7e04b"/>
  <circle cx="33" cy="12" r="8" fill="none" stroke="#2c2a24" stroke-width="2.5"/>
</svg>
