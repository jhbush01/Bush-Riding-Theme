<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Bush Riding">
  <!-- The route: one closed loop, deliberately lopsided so it reads as a track
       and not a target, with the trailhead punched out of it at the top.

       TWO COLOURS, both from the brand palette (Artboard 9): cream #EDECC5 and
       olive #4C4B3B. Nothing else. The mark previously drew its loop in the
       route rust #C0774C, which is not a palette colour. The map's route lines
       have since moved to this same olive, so the mark and the routes it
       depicts are drawn in one colour again.

       The trailhead is cream on olive, 7.32:1, which is what lets it survive
       being 4px across. Every alternative was measured at 16/24/32/48/96/180
       on light and dark chrome: a khaki dot is 2.74:1 on the olive loop and
       smudges shut by 24px, and sage is little better. Lemon works, but reads
       as the map's event marker and puts yellow back in the mark.

       Ground is #EDECC5 to match the theme-color meta in index.html; keep the
       two in step. Square-cornered variant for the iOS touch icon and the
       Shopify favicon is generated by scripts/build-icons.js. -->
  <rect width="64" height="64" rx="14" fill="#edecc5"/>
  <path d="M33 12c12 1 18.5 9.5 16 20-2.4 10-11 20-21 18.5C18 49 12 40 14 29.5 16 19 22 11 33 12Z"
        fill="none" stroke="#4c4b3b" stroke-width="10" stroke-linejoin="round"/>
  <circle cx="33" cy="12" r="8" fill="#edecc5"/>
  <circle cx="33" cy="12" r="8" fill="none" stroke="#4c4b3b" stroke-width="2.5"/>
</svg>
