<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3D pin spike — Bush Riding (experimental)</title>
    <meta name="robots" content="noindex, nofollow" />

    <!-- Same MapLibre build as production (map/index.html): v5.24.0 from unpkg. -->
    <link href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>

    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!--
      Three.js as a plain ES module from a CDN — no npm, no bundler, so this page
      works under Cloudflare Pages' existing "no build command" config exactly
      like the production map does. See README.md for why this spike is plain
      Three.js rather than React-Three-Fiber.
    -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.169.0/build/three.module.js"
        }
      }
    </script>

    <style>
      :root {
        --cream: #e9e2d0;
        --cream-panel: #f4efe2;
        --ink: #2c2a24;
        --ink-soft: #5a5346;
        --terracotta: #c1572e;
        --ui-font: "Archivo", system-ui, -apple-system, sans-serif;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--ink);
        font-family: var(--ui-font);
        overflow: hidden;
      }
      #map {
        position: absolute;
        inset: 0;
      }

      .hud {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 5;
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-width: 320px;
        padding: 12px 14px;
        background: rgba(244, 239, 226, 0.86);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(0, 0, 0, 0.08);
        border-radius: 12px;
        box-shadow: 0 2px 12px rgba(28, 26, 21, 0.18);
        color: var(--ink);
      }
      .hud h1 {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .hud p {
        margin: 0;
        font-size: 11.5px;
        line-height: 1.45;
        color: var(--ink-soft);
      }
      .hud__row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .hud button {
        padding: 7px 12px;
        border-radius: 999px;
        border: 1px solid rgba(0, 0, 0, 0.12);
        background: #fff;
        color: var(--ink);
        font-family: var(--ui-font);
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      .hud button:hover {
        border-color: var(--terracotta);
      }
      .hud__stat {
        font-size: 11px;
        color: var(--ink-soft);
        font-variant-numeric: tabular-nums;
      }
      .hud__warn {
        font-size: 11px;
        line-height: 1.4;
        color: #8a3f18;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <div class="hud">
      <h1>3D pin spike — experimental</h1>
      <p>
        Native globe + native terrain, with extruded Three.js pins drawn through a
        MapLibre custom layer. Desktop/tablet only. Not linked from the live map.
      </p>
      <div class="hud__row">
        <button id="toggle-projection" type="button">Switch to mercator</button>
        <button id="toggle-spin" type="button">Stop spin</button>
        <button id="fly-pins" type="button">Fly to pins</button>
      </div>
      <div class="hud__stat" id="stat">booting…</div>
      <div class="hud__warn" id="warn" hidden></div>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
