name: CI
on:
  push:
  workflow_dispatch:
    inputs:
      url:
        description: "URL for the public Lighthouse run"
        required: false
        default: ""

jobs:
  # Which checks can actually run here? The Shopify Lighthouse action needs
  # store credentials, and without them it fails at the action step before it
  # tests a single page — which for a long time left a permanently red
  # "Lighthouse" check that looked like a failing site but was really no data
  # at all. Now the job is skipped, loudly, when it isn't configured.
  config:
    name: Check configuration
    runs-on: ubuntu-latest
    outputs:
      shopify_lighthouse: ${{ steps.check.outputs.shopify_lighthouse }}
    steps:
      - id: check
        env:
          STORE: ${{ secrets.SHOP_STORE_OS2 }}
          ACCESS_TOKEN: ${{ secrets.SHOP_ACCESS_TOKEN }}
        run: |
          if [ -n "$STORE" ] && [ -n "$ACCESS_TOKEN" ]; then
            echo "shopify_lighthouse=true" >> "$GITHUB_OUTPUT"
          else
            echo "shopify_lighthouse=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Lighthouse (Shopify preview): skipped"
              echo
              echo "This job builds a preview theme on the store and audits it, which needs"
              echo "repository secrets that aren't set:"
              echo
              echo '- `SHOP_STORE_OS2` — the myshopify domain'
              echo '- `SHOP_PASSWORD_OS2` — storefront password, if the store is locked'
              echo '- `SHOP_ACCESS_TOKEN` — a Theme Access token'
              echo '- `SHOP_PULL_THEME` — id of the theme to pull settings from'
              echo '- `LHCI_GITHUB_TOKEN` — optional, for the LHCI GitHub app'
              echo
              echo "Add them under Settings → Secrets and variables → Actions."
              echo "The public Lighthouse job below runs regardless and needs no credentials."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  lhci:
    name: Lighthouse (Shopify preview)
    needs: config
    if: needs.config.outputs.shopify_lighthouse == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    # To post the per-page scores back onto the commit (see "Report").
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Checks the store settings without printing them: is each one the right
      # shape, and does the store accept the token? Written to the summary and
      # the commit, because when the action fails it says why only in its log.
      - name: Check the store settings
        id: preflight
        env:
          STORE: ${{ secrets.SHOP_STORE_OS2 }}
          ACCESS_TOKEN: ${{ secrets.SHOP_ACCESS_TOKEN }}
          PULL_THEME: ${{ secrets.SHOP_PULL_THEME }}
          PASSWORD: ${{ secrets.SHOP_PASSWORD_OS2 }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set +e
          ok() { echo "- ✅ $1"; }
          bad() { echo "- ❌ $1"; }
          {
            echo "### Lighthouse (Shopify preview): store settings check"
            echo
            if [ -z "$STORE" ]; then bad '`SHOP_STORE_OS2` is empty'; fi
            case "$STORE" in *" "*|*"/"*) bad '`SHOP_STORE_OS2` contains a space or a slash — it must be exactly `yourstore.myshopify.com`, no https:// and no trailing /' ;; esac
            echo "- ℹ️ \`SHOP_STORE_OS2\` is ${#STORE} characters long"
            case "$STORE" in
              *.myshopify.com) ok '`SHOP_STORE_OS2` ends in .myshopify.com' ;;
              http*) bad '`SHOP_STORE_OS2` starts with http — it must be just `yourstore.myshopify.com`' ;;
              *) bad '`SHOP_STORE_OS2` is not a `….myshopify.com` domain — the action needs the myshopify domain, not bushriding.cc' ;;
            esac
            case "$ACCESS_TOKEN" in
              shptka_*) ok '`SHOP_ACCESS_TOKEN` looks like a Theme Access password (shptka_…)' ;;
              shpat_*) ok '`SHOP_ACCESS_TOKEN` looks like an Admin API token (shpat_…)' ;;
              *) bad '`SHOP_ACCESS_TOKEN` is neither a Theme Access password (shptka_…) nor an Admin API token (shpat_…)' ;;
            esac
            if [ -n "$PASSWORD" ]; then ok '`SHOP_PASSWORD_OS2` is set'; else echo "- ⚪ \`SHOP_PASSWORD_OS2\` is empty (fine only if the storefront has no password)"; fi
            case "$PULL_THEME" in
              '') echo "- ⚪ \`SHOP_PULL_THEME\` is empty (the preview will use default settings)" ;;
              *[!0-9]*) bad '`SHOP_PULL_THEME` must be a numeric theme id' ;;
              *) ok '`SHOP_PULL_THEME` is a numeric theme id' ;;
            esac
            if [ "${ACCESS_TOKEN#shptka_}" != "$ACCESS_TOKEN" ]; then
              url="https://theme-kit-access.shopifyapps.com/cli/admin/api/2024-10/themes.json"
              code=$(curl -s -o themes.json -w '%{http_code}' -H "X-Shopify-Access-Token: $ACCESS_TOKEN" -H "X-Shopify-Shop: $STORE" "$url")
            else
              code=$(curl -s -o themes.json -w '%{http_code}' -H "X-Shopify-Access-Token: $ACCESS_TOKEN" "https://$STORE/admin/api/2024-10/themes.json")
            fi
            rc=$?
            [ "$rc" != 0 ] && bad "couldn't reach the store at all (curl exit $rc$([ "$rc" = 6 ] && echo ': the store address does not resolve — SHOP_STORE_OS2 is not a real host name'))"
            case "$code" in
              000) : ;;
              200) ok "the store accepted the token (HTTP 200)"
                   if [ -n "$PULL_THEME" ]; then
                     if grep -q "\"id\":$PULL_THEME," themes.json; then ok 'the `SHOP_PULL_THEME` theme exists on the store'; else bad 'no theme with the `SHOP_PULL_THEME` id exists on the store (it was deleted or the id is wrong)'; fi
                   fi
                   echo "- ℹ️ themes on the store: $(grep -o '"id":' themes.json | wc -l | tr -d ' ') (a store holds at most 20; a full store makes the preview push fail)" ;;
              401|403) bad "the store rejected the token (HTTP $code) — it has expired, been revoked, or lacks theme access. Make a new one in the Theme Access app." ;;
              404) bad "the store wasn't found (HTTP 404) — check \`SHOP_STORE_OS2\`" ;;
              *) bad "unexpected answer from the store (HTTP $code)" ;;
            esac
          } > preflight.md
          rm -f themes.json
          cat preflight.md >> "$GITHUB_STEP_SUMMARY"
          python3 -c "import json;print(json.dumps({'body': open('preflight.md').read()}))" > pf.json
          gh api "repos/$REPO/commits/$SHA/comments" --input pf.json --silent || true
      # The action asks the Admin API for "the first product" unless it's told
      # one, and a Theme Access password can't read products — so it fails
      # before testing a page. Find one from the storefront instead (through
      # the password page, which is what the action itself does later).
      - name: Find a product to test
        id: product
        env:
          STORE: ${{ secrets.SHOP_STORE_OS2 }}
          PASSWORD: ${{ secrets.SHOP_PASSWORD_OS2 }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set +e
          jar=$(mktemp)
          curl -sL -c "$jar" -b "$jar" -o /dev/null "https://$STORE/password"
          if [ -n "$PASSWORD" ]; then
            curl -sL -c "$jar" -b "$jar" -o /dev/null -X POST \
              --data-urlencode "form_type=storefront_password" --data-urlencode "utf8=✓" \
              --data-urlencode "password=$PASSWORD" "https://$STORE/password"
          fi
          handle=$(curl -sL -b "$jar" "https://$STORE/products.json?limit=1" \
            | python3 -c "import json,sys
          try:
            d=json.load(sys.stdin); print((d.get('products') or [{}])[0].get('handle',''))
          except Exception:
            print('')")
          rm -f "$jar"
          echo "handle=$handle" >> "$GITHUB_OUTPUT"
          if [ -n "$handle" ]; then msg="- ✅ product page to test: \`/products/$handle\`"; else msg="- ❌ couldn't find a product through the storefront (is \`SHOP_PASSWORD_OS2\` the storefront password, and is a product published to the Online Store?)"; fi
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          python3 -c "import json,sys;print(json.dumps({'body': sys.argv[1]}))" "$msg" > pr.json
          gh api "repos/$REPO/commits/$SHA/comments" --input pr.json --silent || true
      - name: Lighthouse
        id: shopify_lighthouse
        uses: shopify/lighthouse-ci-action@v1
        with:
          store: ${{ secrets.SHOP_STORE_OS2 }}
          password: ${{ secrets.SHOP_PASSWORD_OS2 }}
          access_token: ${{ secrets.SHOP_ACCESS_TOKEN }}
          collection_handle: all
          product_handle: ${{ steps.product.outputs.handle }}
          lhci_github_app_token: ${{ secrets.LHCI_GITHUB_TOKEN }}
          pull_theme: ${{ secrets.SHOP_PULL_THEME }}

      # The action's own check run carries no output, and the job log isn't
      # readable without signing in to GitHub. So: every page it audited, its
      # four scores and each failed assertion, on the step summary AND as a
      # comment on the commit (readable over the API, or on a phone).
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          node - <<'JS' > lhci-summary.md
          const fs = require('fs'), path = require('path');
          const found = [];
          (function walk(d, depth) {
            if (depth > 5) return;
            let list = [];
            try { list = fs.readdirSync(d, { withFileTypes: true }); } catch (e) { return; }
            for (const f of list) {
              const p = path.join(d, f.name);
              if (f.isDirectory() && f.name !== 'node_modules' && f.name !== '.git') walk(p, depth + 1);
              else if (/^lhr-.*\.json$|^assertion-results\.json$/.test(f.name)) found.push(p);
            }
          })(process.cwd(), 0);
          const pct = (c) => (c && c.score != null ? Math.round(c.score * 100) : '—');
          console.log('### Lighthouse (Shopify preview) — per page\n');
          const lhrs = found.filter((f) => /lhr-/.test(f));
          if (!lhrs.length) console.log('No Lighthouse reports were written to the workspace — the action failed before auditing (credentials, password or theme id). See the job log.\n');
          if (lhrs.length) {
            console.log('| Page | Perf | A11y | Best pr. | SEO | LCP | TBT | CLS |');
            console.log('| --- | --- | --- | --- | --- | --- | --- | --- |');
            for (const f of lhrs) {
              const r = JSON.parse(fs.readFileSync(f, 'utf8')), c = r.categories || {}, a = r.audits || {};
              const u = (r.finalDisplayedUrl || r.finalUrl || r.requestedUrl || '').replace(/\?.*$/, '');
              const v = (id) => (a[id] && a[id].displayValue) || '—';
              console.log(`| ${u} | ${pct(c.performance)} | ${pct(c.accessibility)} | ${pct(c['best-practices'])} | ${pct(c.seo)} | ${v('largest-contentful-paint')} | ${v('total-blocking-time')} | ${v('cumulative-layout-shift')} |`);
            }
            const r0 = JSON.parse(fs.readFileSync(lhrs[0], 'utf8'));
            const fails = new Set();
            for (const f of lhrs) {
              const r = JSON.parse(fs.readFileSync(f, 'utf8'));
              for (const key of ['accessibility', 'best-practices', 'seo']) {
                const c = (r.categories || {})[key];
                if (!c) continue;
                for (const ref of c.auditRefs || []) {
                  const x = (r.audits || {})[ref.id];
                  if (x && x.score !== null && x.score < 0.9 && x.scoreDisplayMode !== 'notApplicable' && x.scoreDisplayMode !== 'manual') {
                    const items = ((x.details && x.details.items) || []).slice(0, 3).map((i) => (i.node && (i.node.selector || i.node.snippet)) || i.url || '').filter(Boolean);
                    fails.add(`- ${c.title}: **${x.title}**${items.length ? ' — `' + items.join('`, `') + '`' : ''}`);
                  }
                }
              }
            }
            if (fails.size) { console.log('\n#### Failing audits\n'); for (const l of fails) console.log(l); }
          }
          const ar = found.find((f) => /assertion-results/.test(f));
          if (ar) {
            const list = JSON.parse(fs.readFileSync(ar, 'utf8')).filter((x) => !x.passed);
            if (list.length) {
              console.log('\n#### Failed assertions (what turns the check red)\n');
              for (const x of list) console.log(`- ${x.level}: \`${x.auditId || x.name}\` ${x.operator || ''} ${x.expected} — got ${typeof x.actual === 'number' ? Math.round(x.actual * 100) / 100 : x.actual} on ${(x.url || '').replace(/\?.*$/, '')}`);
            }
          }
          JS
          cat lhci-summary.md >> "$GITHUB_STEP_SUMMARY"
          python3 -c "import json;print(json.dumps({'body': open('lhci-summary.md').read()}))" > lhci-comment.json
          gh api "repos/$REPO/commits/$SHA/comments" --input lhci-comment.json --silent || true

      # This action posts a check run with no output, so when it fails the only
      # record is the job log — which is how it stayed red and unexplained for
      # months. Leave a pointer and the shortlist of causes in the summary.
      - name: Explain the failure
        if: failure()
        run: |
          {
            echo "### Lighthouse (Shopify preview): failed"
            echo
            echo "The store credentials ARE set — this job only runs when they are —"
            echo "so this is not a missing-secrets problem. The action failed at its own"
            echo "step. Open the job log for the reason; the usual candidates are:"
            echo
            echo "- the Theme Access token has expired or lacks theme write scope"
            echo '- `SHOP_PASSWORD_OS2` is wrong, and the storefront is password-protected'
            echo '- `SHOP_PULL_THEME` names a theme id that no longer exists'
            echo '- `collection_handle: all` resolves to no products to audit'
            echo "- LHCI assertions failed, i.e. the site is genuinely below the budget"
            echo
            echo "The last one is the one worth ruling in or out first: it would mean this"
            echo "check has been reporting a real result all along. The public Lighthouse"
            echo "job measures the live site with no credentials and always reports scores."
          } >> "$GITHUB_STEP_SUMMARY"

  # Audits the live site with no credentials at all, so there is always a real
  # number to look at. While the store is password-protected this measures the
  # password page — which is the page customers actually reach, so it is worth
  # measuring — and it measures the storefront once the lock comes off.
  #
  # Reports, never blocks: a slow page should not stop a deploy, and a check
  # that fails for reasons nobody acts on is how the last one got ignored.
  lighthouse-public:
    name: Lighthouse (public URL)
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # To post the summary back onto the commit. GitHub renders step summaries
    # in the browser but does not serve them over the API, so a commit comment
    # is the only form of this report a tool (or a person on a phone) can read
    # without downloading the run's artifact.
    permissions:
      contents: write
    steps:
      - name: Audit
        env:
          TARGET_URL: ${{ github.event.inputs.url || vars.LIGHTHOUSE_URL || 'https://bushriding.cc' }}
        run: |
          set -euo pipefail
          echo "Auditing $TARGET_URL"
          npx --yes lighthouse@12 "$TARGET_URL" \
            --quiet \
            --chrome-flags="--headless=new --no-sandbox --disable-dev-shm-usage" \
            --output=json --output=html \
            --output-path=./lighthouse \
            --form-factor=mobile \
            --throttling-method=simulate

      - name: Summarise
        env:
          TARGET_URL: ${{ github.event.inputs.url || vars.LIGHTHOUSE_URL || 'https://bushriding.cc' }}
        run: |
          node - <<'JS' > summary.md
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('./lighthouse.report.json', 'utf8'));
          const pct = (c) => (c && c.score != null ? Math.round(c.score * 100) : null);
          const mark = (n) => (n == null ? '—' : n >= 90 ? '🟢' : n >= 50 ? '🟠' : '🔴');
          const cats = r.categories || {};
          const order = ['performance', 'accessibility', 'best-practices', 'seo'];

          console.log('### Lighthouse — mobile, simulated throttling\n');
          console.log('`' + (process.env.TARGET_URL || '') + '`\n');
          console.log('| Category | Score |');
          console.log('| --- | --- |');
          for (const key of order) {
            const c = cats[key];
            if (!c) continue;
            const n = pct(c);
            console.log(`| ${c.title} | ${mark(n)} ${n == null ? 'n/a' : n} |`);
          }

          const metrics = ['first-contentful-paint', 'largest-contentful-paint', 'total-blocking-time', 'cumulative-layout-shift', 'speed-index'];
          console.log('\n| Metric | Value |');
          console.log('| --- | --- |');
          for (const id of metrics) {
            const a = (r.audits || {})[id];
            if (a) console.log(`| ${a.title} | ${a.displayValue || 'n/a'} |`);
          }

          const weight = (r.audits || {})['total-byte-weight'];
          if (weight) console.log(`| ${weight.title} | ${weight.displayValue || 'n/a'} |`);

          // The scores say how bad; these say what to do about it. Without this
          // the only way to see which audits failed was to download the HTML
          // report, which is exactly the friction that let the old check sit
          // red and unread.
          const kb = (b) => (b == null ? null : Math.round(b / 1024) + ' KiB');
          const opportunities = Object.values(r.audits || {})
            .filter((a) => a && a.details && a.details.type === 'opportunity')
            .filter((a) => (a.details.overallSavingsMs || 0) > 0 || (a.details.overallSavingsBytes || 0) > 0)
            .sort((a, b) => (b.details.overallSavingsMs || 0) - (a.details.overallSavingsMs || 0));

          if (opportunities.length) {
            console.log('\n#### Worth fixing, biggest first\n');
            console.log('| Opportunity | Est. saving |');
            console.log('| --- | --- |');
            for (const a of opportunities) {
              const ms = a.details.overallSavingsMs ? Math.round(a.details.overallSavingsMs) + ' ms' : null;
              const by = kb(a.details.overallSavingsBytes);
              console.log(`| ${a.title} | ${[ms, by].filter(Boolean).join(' · ') || '—'} |`);
            }
          }

          // Everything else that scored below par, by category, so Best
          // Practices and SEO stop being a bare number nobody can act on.
          for (const key of ['best-practices', 'seo', 'accessibility']) {
            const c = cats[key];
            if (!c || !c.auditRefs) continue;
            const failed = c.auditRefs
              .map((ref) => (r.audits || {})[ref.id])
              .filter((a) => a && a.score !== null && a.score < 0.9 && a.scoreDisplayMode !== 'notApplicable');
            if (!failed.length) continue;
            console.log(`\n#### ${c.title} — what is failing\n`);
            for (const a of failed) console.log(`- **${a.title}**${a.displayValue ? ' — ' + a.displayValue : ''}`);
          }

          console.log('\nFull HTML report is attached to this run as an artifact.');
          JS
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post the summary onto the commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 -c "import json;print(json.dumps({'body': open('summary.md').read()}))" > comment.json
          gh api "repos/$REPO/commits/$SHA/comments" --input comment.json --silent
          echo "Posted the Lighthouse summary to commit $SHA."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: |
            lighthouse.report.html
            lighthouse.report.json
          retention-days: 14

  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Theme Check
        uses: shopify/theme-check-action@v2
        with:
          token: ${{ github.token }}
