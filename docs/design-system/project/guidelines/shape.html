<!-- @dsCard group="Shape" viewport="700x150" name="Radii" subtitle="Near-square. Pills for filters, 16px for map sheets." -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;font-family:var(--font-body);color:var(--text-body)}
.grid{display:flex;gap:10px;flex-wrap:wrap}.sw{width:106px}
.chip{height:64px;border-radius:var(--radius-sm);border:1px solid var(--line)}
.nm{font-family:var(--font-heading);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-top:6px}
.hx{font-family:ui-monospace,Menlo,monospace;font-size:10px;color:var(--text-muted)}
.tok{font-family:ui-monospace,Menlo,monospace;font-size:10px;color:var(--text-muted)}</style>
</head><body><div class="grid" style="align-items:flex-end">
<div class="sw"><div style="height:56px;background:#fff;border:1px solid var(--line);border-radius:2px"></div><div class="nm">sm 2px</div></div>
<div class="sw"><div style="height:56px;background:#fff;border:1px solid var(--line);border-radius:3px"></div><div class="nm">chip 3px</div></div>
<div class="sw"><div style="height:56px;background:#fff;border:1px solid var(--line);border-radius:4px"></div><div class="nm">md 4px</div></div>
<div class="sw"><div style="height:56px;background:var(--sage);border-radius:16px 16px 0 0"></div><div class="nm">sheet 16px</div></div>
<div class="sw"><div style="height:56px;background:var(--sage);border-radius:999px"></div><div class="nm">pill</div></div></div></body></html>
