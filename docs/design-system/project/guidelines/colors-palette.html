<!-- @dsCard group="Colors" viewport="700x185" name="The palette" subtitle="Six colours. Nothing else is a brand colour." -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;font-family:var(--font-body);color:var(--text-body)}
.grid{display:flex;gap:10px;flex-wrap:wrap}.sw{width:106px}
.chip{height:64px;border-radius:var(--radius-sm);border:1px solid var(--line)}
.nm{font-family:var(--font-heading);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-top:6px}
.hx{font-family:ui-monospace,Menlo,monospace;font-size:10px;color:var(--text-muted)}
.tok{font-family:ui-monospace,Menlo,monospace;font-size:10px;color:var(--text-muted)}</style>
</head><body><div class="grid"><div class="sw"><div class="chip" style="background:var(--bone)"></div><div class="nm">Bone</div><div class="hx">#edecc5</div></div><div class="sw"><div class="chip" style="background:var(--sage)"></div><div class="nm">Sage</div><div class="hx">#b9bea3</div></div><div class="sw"><div class="chip" style="background:var(--mist)"></div><div class="nm">Mist</div><div class="hx">#a7b8b4</div></div><div class="sw"><div class="chip" style="background:var(--khaki)"></div><div class="nm">Khaki</div><div class="hx">#828059</div></div><div class="sw"><div class="chip" style="background:var(--olive)"></div><div class="nm">Olive</div><div class="hx">#4c4b3b</div></div><div class="sw"><div class="chip" style="background:var(--flare)"></div><div class="nm">Flare</div><div class="hx">#ede270</div></div></div>
<div class="tok" style="margin-top:12px">Bone, Mist and Olive are the hex values labelled on the brand board. Sage, Khaki and Flare are unlabelled swatches on the same board, colour-matched from the artwork — send exact hexes to lock them.</div></body></html>
