<!-- @dsCard group="Colors" viewport="700x190" name="Colour roles" subtitle="Olive is the ink and the primary; flare is the only accent" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;font-family:var(--font-body);color:var(--text-body)}
.grid{display:flex;gap:10px;flex-wrap:wrap}.sw{width:106px}
.chip{height:64px;border-radius:var(--radius-sm);border:1px solid var(--line)}
.nm{font-family:var(--font-heading);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-top:6px}
.hx{font-family:ui-monospace,Menlo,monospace;font-size:10px;color:var(--text-muted)}
.tok{font-family:ui-monospace,Menlo,monospace;font-size:10px;color:var(--text-muted)}</style>
</head><body><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">
<div style="background:var(--bone);border:1px solid var(--line);padding:14px;border-radius:var(--radius-md)">
<div style="font-family:var(--font-heading);font-weight:700;color:var(--olive)">Heading in olive</div>
<div style="color:var(--olive)">Body copy in olive</div><div style="color:var(--khaki);font-size:13px">Muted meta in khaki</div></div>
<div style="background:var(--olive);padding:14px;border-radius:var(--radius-md)">
<div style="font-family:var(--font-heading);font-weight:700;color:var(--bone)">On olive</div>
<div style="color:var(--bone)">Body in bone</div><div style="color:var(--sage);font-size:13px">Muted in sage</div></div>
<div style="background:var(--flare);padding:14px;border-radius:var(--radius-md)">
<div style="font-family:var(--font-heading);font-weight:700;color:var(--olive)">On flare</div>
<div style="color:var(--olive);font-size:13px">Always olive on flare. One accent per screen.</div></div></div></body></html>
