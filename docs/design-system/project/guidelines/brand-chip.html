<!-- @dsCard group="Brand" viewport="700x150" name="The chip" subtitle="The storefront's one button/label shape" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;font-family:var(--font-body);color:var(--text-body)}
.grid{display:flex;gap:10px;flex-wrap:wrap}.sw{width:106px}
.chip{height:64px;border-radius:var(--radius-sm);border:1px solid var(--line)}
.nm{font-family:var(--font-heading);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-top:6px}
.hx{font-family:ui-monospace,Menlo,monospace;font-size:10px;color:var(--text-muted)}
.tok{font-family:ui-monospace,Menlo,monospace;font-size:10px;color:var(--text-muted)}</style>
</head><body><div class="grid" style="align-items:center">
<span style="display:inline-flex;gap:.4em;background:#fff;color:var(--olive);border:1px solid var(--line);border-radius:var(--radius-chip);padding:8px 14px;font-weight:600;font-size:.875rem">Shop</span>
<span style="display:inline-flex;gap:.4em;background:#fff;color:var(--olive);border:1px solid var(--line);border-radius:var(--radius-chip);padding:8px 14px;font-weight:600;font-size:.875rem">Discover Launch Collection <span>✦</span></span>
<span style="display:inline-flex;background:var(--olive);color:var(--bone);border:1px solid var(--olive);border-radius:var(--radius-chip);padding:8px 14px;font-weight:600;font-size:.875rem">Sign up</span>
<span style="display:inline-flex;background:var(--flare);color:var(--olive);border:1px solid var(--flare);border-radius:var(--radius-chip);padding:8px 14px;font-weight:600;font-size:.875rem">Accent action</span></div>
<div class="tok" style="margin-top:12px">3px radius · 1px hairline · Inter 600 · hover inverts to olive</div></body></html>
