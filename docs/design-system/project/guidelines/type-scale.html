<!-- @dsCard group="Type" viewport="700x200" name="Type scale" subtitle="Fluid clamps for display and headings" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;font-family:var(--font-body);color:var(--text-body)}
.grid{display:flex;gap:10px;flex-wrap:wrap}.sw{width:106px}
.chip{height:64px;border-radius:var(--radius-sm);border:1px solid var(--line)}
.nm{font-family:var(--font-heading);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-top:6px}
.hx{font-family:ui-monospace,Menlo,monospace;font-size:10px;color:var(--text-muted)}
.tok{font-family:ui-monospace,Menlo,monospace;font-size:10px;color:var(--text-muted)}</style>
</head><body><table style="border-collapse:collapse;font-size:12px;width:100%">
<tr><td style="font-family:ui-monospace,Menlo,monospace;color:var(--khaki);padding:3px 14px 3px 0">--size-display</td><td style="font-family:ui-monospace,Menlo,monospace;padding:3px 0">clamp(2.4rem,6vw,4.5rem)</td></tr><tr><td style="font-family:ui-monospace,Menlo,monospace;color:var(--khaki);padding:3px 14px 3px 0">--size-h1</td><td style="font-family:ui-monospace,Menlo,monospace;padding:3px 0">clamp(1.9rem,4.4vw,3.2rem)</td></tr><tr><td style="font-family:ui-monospace,Menlo,monospace;color:var(--khaki);padding:3px 14px 3px 0">--size-h2</td><td style="font-family:ui-monospace,Menlo,monospace;padding:3px 0">clamp(1.5rem,3vw,2.25rem)</td></tr><tr><td style="font-family:ui-monospace,Menlo,monospace;color:var(--khaki);padding:3px 14px 3px 0">--size-h3</td><td style="font-family:ui-monospace,Menlo,monospace;padding:3px 0">1.35rem</td></tr><tr><td style="font-family:ui-monospace,Menlo,monospace;color:var(--khaki);padding:3px 14px 3px 0">--size-h4</td><td style="font-family:ui-monospace,Menlo,monospace;padding:3px 0">1.05rem</td></tr><tr><td style="font-family:ui-monospace,Menlo,monospace;color:var(--khaki);padding:3px 14px 3px 0">--size-body-lg</td><td style="font-family:ui-monospace,Menlo,monospace;padding:3px 0">1.125rem</td></tr><tr><td style="font-family:ui-monospace,Menlo,monospace;color:var(--khaki);padding:3px 14px 3px 0">--size-body</td><td style="font-family:ui-monospace,Menlo,monospace;padding:3px 0">1rem</td></tr><tr><td style="font-family:ui-monospace,Menlo,monospace;color:var(--khaki);padding:3px 14px 3px 0">--size-small</td><td style="font-family:ui-monospace,Menlo,monospace;padding:3px 0">.875rem</td></tr><tr><td style="font-family:ui-monospace,Menlo,monospace;color:var(--khaki);padding:3px 14px 3px 0">--size-micro</td><td style="font-family:ui-monospace,Menlo,monospace;padding:3px 0">.75rem</td></tr>
</table></body></html>
