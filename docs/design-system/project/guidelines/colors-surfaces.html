<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces" subtitle="Page, card, muted, cool, inverse, accent" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;font-family:var(--font-body);color:var(--text-body)}
.grid{display:flex;gap:10px;flex-wrap:wrap}.sw{width:106px}
.chip{height:64px;border-radius:var(--radius-sm);border:1px solid var(--line)}
.nm{font-family:var(--font-heading);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-top:6px}
.hx{font-family:ui-monospace,Menlo,monospace;font-size:10px;color:var(--text-muted)}
.tok{font-family:ui-monospace,Menlo,monospace;font-size:10px;color:var(--text-muted)}</style>
</head><body><div class="grid"><div class="sw"><div class="chip" style="background:var(--surface-page)"></div><div class="nm">Page</div><div class="hx">bone</div></div><div class="sw"><div class="chip" style="background:var(--surface-card)"></div><div class="nm">Card</div><div class="hx">paper #fff</div></div><div class="sw"><div class="chip" style="background:var(--surface-muted)"></div><div class="nm">Muted</div><div class="hx">sage</div></div><div class="sw"><div class="chip" style="background:var(--surface-cool)"></div><div class="nm">Cool</div><div class="hx">mist</div></div><div class="sw"><div class="chip" style="background:var(--surface-inverse)"></div><div class="nm">Inverse</div><div class="hx">olive</div></div><div class="sw"><div class="chip" style="background:var(--surface-accent)"></div><div class="nm">Accent</div><div class="hx">flare</div></div></div>
<div class="tok" style="margin-top:8px">White is paper, not a brand colour — surfaces only, never large fields.</div></body></html>
